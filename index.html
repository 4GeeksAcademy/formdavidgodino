<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formuleando</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
          <div class="container-fluid">
            <a class="navbar-brand" href="#">Give me the money</a>
          </div>
        </nav>
      </div>
      <div class="container mt-5">
        <div class="card>">
          <div class="card-body">
            <div class="alert alert-danger" role="alert">Algo está fallando, paga ratita.</div>
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Tarjeta #</label>
                <input type="text" class="form-control" placeholder="XXXXXXXXXXXXXXXX">
              </div>
              <div class="col-md-3">
                <label class="form-label">CVC #</label>
                <input type="text" class="form-control" placeholder="0000">
              </div>
              <div class="col-md-3">
                <label class="form-label">Divisa/Cantidad</label>
                <div class="input-group">
              <div class="input-group-text p-0">
                <select class="form-select">
                    <option value="es">$</option>
                    <option value="ar">€</option>
                  </select>
                </div>
                <input type="text" class="form-control" aria-label="Text input with radio button">
              </div>
              </div>
            </div>
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Apellidos</label>
                <input type="text" class="form-control">
              </div>
            </div>
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Ciudad</label>
                  <input type="text" class="form-control">
                </div>
                <div class="col-md-3">
                  <label class="form-label">País</label>
                  <select class="form-select">
                    <option>Elige un país</option>
                    <option value="es">EESSPAÑITA</option>
                    <option value="ar">Argentina</option>
                    <option value="us">Estados Undios</option>
                    <option value="mx">Marruecos</option>
                    <option value="fr">Aleman</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">CP</label>
                  <input type="text" class="form-control">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Elige el método de </label><br>
                <div class="mb-3">
                  <button type="button" class="btn btn-outline-primary me-2">
                    <i class="fab fa-cc-visa fa-2x"></i>
                  </button>
                  <button type="button" class="btn btn-outline-primary me-2">
                    <i class="fab fa-cc-mastercard fa-2x"></i>
                  </button>
                  <button type="button" class="btn btn-outline-primary me-2">
                    <i class="fab fa-cc-amex fa-2x"></i>
                  </button>
                  <button type="button" class="btn btn-outline-primary">
                    <i class="fa-brands fa-cc-apple-pay fa-2x"></i>
                  </button>
                </div>
              <div class="mb-3">
                <label class="form-label">Mensaje (Opcional)</label>
                <textarea class="form-control" rows="3" placeholder="Escribe aquí tu mensaje"></textarea>
              </div>
              <div class="d-flex justify-content-end">
                <button class="btn btn-secondary me-2">Cancelar</button>
                <button class="btn btn-primary">Enviar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
</body>
</html>
